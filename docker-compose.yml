services:
  backend:
    image: utcc-backend
    pull_policy: never
    container_name: utcc-backend
    env_file: backend.env
    depends_on:
      - db
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - app-network
    ports:
      - 8000:8000

  client:
    image: utcc-client
    pull_policy: never
    container_name: utcc-client
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runner
    depends_on:
      - backend
    ports:
      - 80:80
    networks:
      - app-network

  scramble-service:
    image: utcc-scramble-service
    pull_policy: never
    container_name: utcc-scramble-generator
    build:
      context: ./scramble-service
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
    restart: unless-stopped
    networks:
      - app-network


  db:
    image: postgres:17.4-alpine
    restart: always
    env_file:
      - backend.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge