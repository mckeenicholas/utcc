<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/client-static/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/client-static/favicon.svg" />
		<link rel="shortcut icon" href="/client-static/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/client-static/apple-touch-icon.png" />
		<link rel="manifest" href="/client-static/site.webmanifest" />
		<script
			defer
			src="https://cloud.umami.is/script.js"
			data-website-id="9e1f4bc8-3e88-4056-aa2e-87764ae5411e"
		></script>
		<script>
			try {
				const theme = localStorage.getItem("utcc-theme") || "system";
				const isDark =
					theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (isDark) {
					document.documentElement.classList.add("dark");
				} else {
					document.documentElement.classList.remove("dark");
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
